odroidgoa-uboot-config

# R36S clone (K36 family): boot menu
#
# Runs in the dArkOS4Clone bootloader (Hardkernel U-Boot 2017.09). Lists what
# is on this card, waits menu_timeout seconds, then starts menu_default.
#   any key        stop the countdown
#   VOL+ / VOL-    move   (D-pad up / down also work)
#   POWER          start  (A also works)
# To go back to booting one system directly, replace this file with that
# system's own boot.ini (dArkOS: boot.ini.darkos, mainline: boot.ini.mainline).

# ---- settings ---------------------------------------------------------------
# mainline | darkos | poweroff
setenv menu_default "mainline"
# seconds, 1-9
setenv menu_timeout "4"

# ---- the bootloader's own device tree ----------------------------------------
# Before running this file the bootloader looks for the first line that
# starts with the load command and names a device tree file, and keeps that
# file at 0x01f00000 for itself (display, power chip). Keep the next line the
# first such line, and put nothing else at that address.
setenv dtb_loadaddr "0x01f00000"
load mmc 1:1 ${dtb_loadaddr} rk3326-r36s-type2-panel1-linux.dtb

# ---- systems -------------------------------------------------------------------
setenv loadaddr "0x02000000"
setenv initrd_loadaddr "0x01100000"
setenv kernel_fdt_addr "0x01e00000"
setenv menu_scratch "0x00c00000"

setenv boot_mainline 'setenv bootargs "console=tty0 loglevel=7"; load mmc 1:1 ${loadaddr} Image-mainline && load mmc 1:1 ${initrd_loadaddr} r36s-hwtest.uInitrd && load mmc 1:1 ${kernel_fdt_addr} mainline-r36s-clone.fdt && booti ${loadaddr} ${initrd_loadaddr} ${kernel_fdt_addr}'

# dArkOS as its own boot.ini starts it (bootargs copied from boot.ini.darkos,
# clone type 2 panel 1). Its device tree goes to a separate address so the
# bootloader's copy at 0x01f00000 stays untouched.
setenv boot_darkos 'setenv bootargs "root=/dev/mmcblk0p2 rootwait rw fsck.repair=yes net.ifnames=0 fbcon=rotate:0 console=/dev/ttyFIQ0 quiet splash plymouth.ignore-serial-consoles consoleblank=0 max_cpufreq=1296 boot_cpufreq=1248 max_gpufreq=520 max_ddrfreq=666"; load mmc 1:1 ${loadaddr} Image && load mmc 1:1 ${initrd_loadaddr} uInitrd && load mmc 1:1 ${kernel_fdt_addr} rk3326-r36s-type2-panel1-linux.dtb && booti ${loadaddr} ${initrd_loadaddr} ${kernel_fdt_addr}'

setenv boot_poweroff 'poweroff'

# ---- menu entries: only what is on the card ------------------------------------
# Names are padded to the same width (21) so a redraw fully overwrites the old one.
# This bootloader's setexpr stores results as "0x1", so slot numbers are
# set literally here, never computed (they become part of variable names).
setenv n 0
if size mmc 1:1 Image-mainline; then
  setenv n 1
  setenv m1_id mainline
  setenv m1_name "Mainline Linux (test)"
fi
if size mmc 1:1 Image; then
  if itest ${n} -eq 0; then
    setenv n 1
    setenv m1_id darkos
    setenv m1_name "dArkOS               "
  else
    setenv n 2
    setenv m2_id darkos
    setenv m2_name "dArkOS               "
  fi
fi
if itest ${n} -eq 0; then
  setenv n 1
  setenv m1_id poweroff
  setenv m1_name "Power off            "
elif itest ${n} -eq 1; then
  setenv n 2
  setenv m2_id poweroff
  setenv m2_name "Power off            "
else
  setenv n 3
  setenv m3_id poweroff
  setenv m3_name "Power off            "
fi

setenv sel 1
if test "${m2_id}" = "${menu_default}"; then setenv sel 2; fi
if test "${m3_id}" = "${menu_default}"; then setenv sel 3; fi

# ---- inputs ----------------------------------------------------------------------
# Buttons pull up (as Linux sets them): gpio2 PB5-PB6, gpio3 PB2-PB6, PC0-PC7,
# PD0-PD1 (GRF pull registers, upper half = write mask).
mw.l 0xff140074 0x3c001400
mw.l 0xff140084 0x3ff01550
mw.l 0xff140088 0xffff5555
mw.l 0xff14008c 0x000f0005

# Power key: the PMIC (RK817, I2C 0x20) latches a press in register 0xf8
# bit 0. Find its bus and clear the press that switched the console on.
setenv pk 0
for b in 0 1 2; do
  if itest ${pk} -eq 0; then
    if i2c dev ${b} && i2c read 0x20 0xf8 1 ${menu_scratch}; then
      setenv pk 1
      i2c mw 0x20 0xf8 0x03
    fi
  fi
done

# key: 0 none, 1 up, 2 down, 3 start, 4 any other button.
# VOL+/VOL- share ADC channel 2 (about 0 and 170 of 1023; released 1020).
# Button inputs are low while pressed. hush has no "&": bits are taken
# with / and %.
setenv menu_keys 'run menu_keys_a; run menu_keys_b; run menu_keys_c'
setenv menu_keys_a 'setenv key 0; adc 2; setexpr.l g3 *0xff270050; setexpr.l g2 *0xff260050; if test ${r_adc} -lt 80; then setenv key 1; elif test ${r_adc} -lt 500; then setenv key 2; fi; setexpr b ${g3} / 0x400000; setexpr b ${b} % 2; if itest ${b} -eq 0; then setenv key 1; fi; setexpr b ${g3} / 0x800000; setexpr b ${b} % 2; if itest ${b} -eq 0; then setenv key 2; fi'
setenv menu_keys_b 'setexpr b ${g3} / 0x10000; setexpr b ${b} % 2; if itest ${b} -eq 0; then setenv key 3; fi; if itest ${key} -eq 0; then setexpr b ${g3} / 0x400; setexpr b ${b} % 0x20; if itest ${b} -ne 1f; then setenv key 4; fi; setexpr b ${g3} / 0x10000; setexpr b ${b} % 0x400; if itest ${b} -ne 3ff; then setenv key 4; fi; setexpr b ${g2} / 0x2000; setexpr b ${b} % 4; if itest ${b} -ne 3; then setenv key 4; fi; fi'
setenv menu_keys_c 'if itest ${pk} -eq 1; then if i2c read 0x20 0xf8 1 ${menu_scratch}; then setexpr.b b *${menu_scratch}; setexpr b ${b} % 2; if itest ${b} -eq 1; then i2c mw 0x20 0xf8 0x03; setenv key 3; setenv prev 0; fi; fi; fi'

# ---- screen ------------------------------------------------------------------------
setenv menu_line1 'lcd setline 5; if itest ${sel} -eq 1; then lcd setfg yellow; lcd putstr "  > ${m1_name}"; else lcd setfg white; lcd putstr "    ${m1_name}"; fi'
setenv menu_line2 'lcd setline 7; if itest ${sel} -eq 2; then lcd setfg yellow; lcd putstr "  > ${m2_name}"; else lcd setfg white; lcd putstr "    ${m2_name}"; fi'
setenv menu_line3 'lcd setline 9; if itest ${sel} -eq 3; then lcd setfg yellow; lcd putstr "  > ${m3_name}"; else lcd setfg white; lcd putstr "    ${m3_name}"; fi'
setenv menu_draw 'run menu_line1; if itest ${n} -ge 2; then run menu_line2; fi; if itest ${n} -ge 3; then run menu_line3; fi'
setenv menu_count 'run menu_clr13; lcd setfg cyan; lcd putstr "  Starting in ${secs} s, any key stops"'
setenv menu_help 'run menu_clr13; lcd setfg grey; lcd putstr "  VOL+/-: choose   POWER: start     "'
setenv menu_clr13 'lcd setline 13; lcd putstr "                                    "; lcd setline 13'
setenv menu_title 'lcd settransp 0; lcd setbg black; lcd clear; lcd setline 2; lcd setfg white; lcd putstr "  R36S clone - boot menu"'

# ---- menu loop --------------------------------------------------------------------
# If the chosen system cannot be started, the menu comes back without a countdown.
setexpr ticks ${menu_timeout} * 0xa
setenv secs ${menu_timeout}
setenv counting 1
setenv done 0
run menu_title
run menu_draw
run menu_count
run menu_keys
setenv prev ${key}

while itest ${done} -eq 0; do
  sleep 0.08
  run menu_keys
  if itest ${key} -ne 0 && itest ${key} -ne ${prev}; then
    if itest ${counting} -eq 1; then
      setenv counting 0
      run menu_help
    fi
    if itest ${key} -eq 1; then
      if itest ${sel} -le 1; then setenv sel ${n}; else setexpr sel ${sel} - 1; fi
      run menu_draw
    elif itest ${key} -eq 2; then
      if itest ${sel} -ge ${n}; then setenv sel 1; else setexpr sel ${sel} + 1; fi
      run menu_draw
    elif itest ${key} -eq 3; then
      setenv done 1
    fi
  fi
  setenv prev ${key}
  if itest ${counting} -eq 1; then
    setexpr ticks ${ticks} - 1
    if itest ${ticks} -le 0; then
      setenv done 1
    else
      setexpr s ${ticks} + 9
      setexpr s ${s} / 0xa
      if itest ${s} -ne ${secs}; then
        setexpr secs sub "^0x" "" "${s}"
        run menu_count
      fi
    fi
  fi

  if itest ${done} -eq 1; then
    if itest ${sel} -eq 1; then setenv id ${m1_id}; setenv name "${m1_name}"; fi
    if itest ${sel} -eq 2; then setenv id ${m2_id}; setenv name "${m2_name}"; fi
    if itest ${sel} -eq 3; then setenv id ${m3_id}; setenv name "${m3_name}"; fi
    run menu_clr13
    lcd setfg white
    lcd putstr "  Starting ${name} ..."
    run boot_${id}
    run menu_clr13
    lcd setfg red
    lcd putstr "  Could not start ${name}"
    setenv done 0
    setenv counting 0
  fi
done
